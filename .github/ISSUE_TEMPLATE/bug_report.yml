name: 🐞 Reportar un problema
description: Algo no funciona como debería.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: ¿Qué pasó?
      description: Describe el problema.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a...
        2. Pulsar...
        3. Ver el error
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Calendario
        - Tareas
        - Correo
        - Inicio de sesión / cuentas
        - Otra
  - type: input
    id: browser
    attributes:
      label: Navegador y sistema operativo
      placeholder: Firefox 140 en Ubuntu
